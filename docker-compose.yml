services:
  app:
    build:
      context: .
      target: production
    hostname: app
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-postgres}"
      REDIS_URL: "redis://cache:6379/0"
    expose:
      - "3000"
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: Database-Blog-Prod
    image: postgres:16
    command: postgres -c 'max_connections=450'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    # No host port mapping in production: the app reaches Postgres over the Docker
    # network (postgres:5432), so exposing it to the host is needless attack surface.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 30s
      timeout: 10s
      retries: 5

  cache:
    image: redis
    volumes:
      - redisdata:/data
    # No host port mapping in production: the app reaches Redis over the Docker
    # network (cache:6379). Redis has no auth here, so exposing it is worse still.
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  nginx:
    image: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
    ports:
      - "4000:80"

volumes:
  pgdata:
  redisdata:
  uploads:
